@if (master(); as master) {
  <form
    class="profile-fields profile-form"
    data-testid="profile-form"
    [formGroup]="form"
    (ngSubmit)="save()"
  >
    <label class="pt-2 text-muted" for="edit-name">{{ 'master.field.name' | t }}</label>
    <input
      pInputText
      id="edit-name"
      data-testid="edit-name"
      formControlName="name"
      [invalid]="invalid('name')"
      [attr.aria-invalid]="invalid('name')"
    />

    <label class="pt-2 text-muted" for="edit-description">{{
      'salon.field.description' | t
    }}</label>
    <textarea
      pTextarea
      id="edit-description"
      data-testid="edit-description"
      rows="4"
      formControlName="description"
      [invalid]="invalid('description')"
      [attr.aria-invalid]="invalid('description')"
    ></textarea>

    <label class="pt-2 text-muted" for="edit-specialization">{{
      'master.field.specialization' | t
    }}</label>
    <p-select
      inputId="edit-specialization"
      data-testid="edit-specialization"
      formControlName="specialization"
      optionLabel="label"
      optionValue="value"
      [options]="specializationOptions()"
    />

    <label class="pt-2 text-muted" for="edit-addressStreet">{{
      'salon.field.addressStreet' | t
    }}</label>
    <input
      pInputText
      id="edit-addressStreet"
      data-testid="edit-addressStreet"
      formControlName="addressStreet"
      [invalid]="invalid('addressStreet')"
      [attr.aria-invalid]="invalid('addressStreet')"
    />

    <label class="pt-2 text-muted" for="edit-addressHouseNumber">{{
      'salon.field.addressHouseNumber' | t
    }}</label>
    <input
      pInputText
      id="edit-addressHouseNumber"
      data-testid="edit-addressHouseNumber"
      formControlName="addressHouseNumber"
      [invalid]="invalid('addressHouseNumber')"
      [attr.aria-invalid]="invalid('addressHouseNumber')"
    />

    <label class="pt-2 text-muted" for="edit-addressCityCode">{{
      'salon.field.addressCityCode' | t
    }}</label>
    <div>
      <input
        pInputText
        class="w-full"
        id="edit-addressCityCode"
        data-testid="edit-addressCityCode"
        inputmode="numeric"
        formControlName="addressCityCode"
        [invalid]="invalid('addressCityCode')"
        [attr.aria-invalid]="invalid('addressCityCode')"
      />
      <p class="mt-1 text-xs text-muted">
        {{ 'salon.edit.cityCodeHint' | t: { city: master.addressCity || '—' } }}
      </p>
    </div>

    <label class="pt-2 text-muted" for="edit-addressZipCode">{{
      'salon.field.addressZipCode' | t
    }}</label>
    <input
      pInputText
      id="edit-addressZipCode"
      data-testid="edit-addressZipCode"
      placeholder="MD-2012"
      formControlName="addressZipCode"
      [invalid]="invalid('addressZipCode')"
      [attr.aria-invalid]="invalid('addressZipCode')"
    />

    <label class="pt-2 text-muted" for="edit-phone">{{ 'master.field.phone' | t }}</label>
    <input
      pInputText
      id="edit-phone"
      data-testid="edit-phone"
      type="tel"
      formControlName="phone"
      [invalid]="invalid('phone')"
      [attr.aria-invalid]="invalid('phone')"
    />

    <label class="pt-2 text-muted" for="edit-email">{{ 'master.field.email' | t }}</label>
    <div>
      <input
        pInputText
        class="w-full"
        id="edit-email"
        data-testid="edit-email"
        disabled
        [value]="master.email"
      />
      <p class="mt-1 text-xs text-muted">{{ 'master.edit.accountReadonly' | t }}</p>
    </div>

    <label class="pt-2 text-muted" for="edit-bufferMinutes">{{ 'master.field.buffer' | t }}</label>
    <input
      pInputText
      id="edit-bufferMinutes"
      data-testid="edit-bufferMinutes"
      type="number"
      min="0"
      max="120"
      step="1"
      formControlName="bufferMinutes"
      [invalid]="invalid('bufferMinutes')"
      [attr.aria-invalid]="invalid('bufferMinutes')"
    />

    <label class="pt-2 text-muted" for="edit-bookingForwardDays">{{
      'master.field.bookingHorizon' | t
    }}</label>
    <input
      pInputText
      id="edit-bookingForwardDays"
      data-testid="edit-bookingForwardDays"
      type="number"
      min="0"
      max="365"
      step="1"
      formControlName="bookingForwardDays"
      [invalid]="invalid('bookingForwardDays')"
      [attr.aria-invalid]="invalid('bookingForwardDays')"
    />

    <label class="pt-2 text-muted" for="edit-brandColor">{{ 'master.field.brandColor' | t }}</label>
    <div>
      <input
        pInputText
        class="w-full"
        id="edit-brandColor"
        data-testid="edit-brandColor"
        placeholder="#aa3366"
        formControlName="brandColor"
        [invalid]="invalid('brandColor')"
        [attr.aria-invalid]="invalid('brandColor')"
      />
      <p class="mt-1 text-xs text-muted">{{ 'salon.edit.brandColorHint' | t }}</p>
    </div>

    <label class="pt-2 text-muted" for="edit-reason">{{ 'salon.edit.reason' | t }}</label>
    <input
      pInputText
      id="edit-reason"
      data-testid="edit-reason"
      maxlength="500"
      [formControl]="reason"
    />

    @if (conflict()) {
      <p-message
        class="field-wide"
        severity="warn"
        icon="pi pi-exclamation-triangle"
        data-testid="edit-conflict"
      >
        <div class="flex flex-wrap items-center gap-3">
          <span>{{ 'master.edit.conflict' | t }}</span>
          <button
            pButton
            type="button"
            size="small"
            severity="warn"
            data-testid="edit-reload"
            [label]="'salon.edit.reload' | t"
            [loading]="busy()"
            (click)="reload()"
          ></button>
        </div>
      </p-message>
    }

    <div class="field-wide flex gap-2 pt-2">
      <button
        pButton
        type="submit"
        data-testid="edit-save"
        [label]="'salon.edit.save' | t"
        [disabled]="!canSave()"
        [loading]="busy() && !conflict()"
      ></button>
      <button
        pButton
        type="button"
        severity="secondary"
        data-testid="edit-cancel"
        [text]="true"
        [label]="'salon.edit.cancel' | t"
        [disabled]="busy()"
        (click)="closed.emit()"
      ></button>
    </div>
  </form>
}
