<main class="flex min-h-full items-center justify-center bg-slate-100 p-6">
  <section class="w-full max-w-sm rounded-xl bg-white p-8 shadow-md">
    <div class="mb-6 flex items-center justify-between gap-4">
      <span class="text-lg font-semibold text-slate-900">BookMe</span>
      <app-language-switcher />
    </div>

    @if (errorMessage(); as message) {
      <p-message data-testid="login-error" severity="error" styleClass="mb-4 w-full">{{ message }}</p-message>
    }
    @if (infoMessage(); as message) {
      <p-message data-testid="login-info" severity="info" styleClass="mb-4 w-full">{{ message }}</p-message>
    }

    @if (step() === 'password') {
      <h1 class="mb-4 text-xl font-semibold text-slate-900">{{ 'login.title' | t }}</h1>
      <form class="flex flex-col gap-4" [formGroup]="passwordForm" (ngSubmit)="submitPassword()">
        <label class="flex flex-col gap-1 text-sm text-slate-700">
          {{ 'login.email' | t }}
          <input pInputText type="email" formControlName="email" autocomplete="username" data-testid="login-email" />
        </label>
        <label class="flex flex-col gap-1 text-sm text-slate-700">
          {{ 'login.password' | t }}
          <p-password
            formControlName="password"
            [feedback]="false"
            [toggleMask]="true"
            autocomplete="current-password"
            inputStyleClass="w-full"
            styleClass="w-full"
            data-testid="login-password"
          />
        </label>
        <p-button
          type="submit"
          styleClass="w-full"
          [label]="'login.submit' | t"
          [loading]="busy()"
          [disabled]="passwordForm.invalid"
          data-testid="login-submit"
        />
      </form>
    } @else {
      <h1 class="mb-2 text-xl font-semibold text-slate-900">{{ 'login.totp.title' | t }}</h1>
      <p class="mb-4 text-sm text-slate-600">{{ 'login.totp.hint' | t }}</p>
      <form class="flex flex-col gap-4" [formGroup]="totpForm" (ngSubmit)="submitTotp()">
        <p-inputotp
          formControlName="code"
          [length]="totpLength"
          [integerOnly]="true"
          [autofocus]="true"
          [attr.aria-label]="'login.totp.code' | t"
          data-testid="login-totp"
        />
        <p-button
          type="submit"
          styleClass="w-full"
          [label]="'login.totp.submit' | t"
          [loading]="busy()"
          [disabled]="totpForm.invalid"
          data-testid="login-totp-submit"
        />
        <p-button
          type="button"
          styleClass="w-full"
          severity="secondary"
          [text]="true"
          [label]="'login.totp.back' | t"
          (onClick)="backToPassword()"
        />
      </form>
    }
  </section>
</main>
