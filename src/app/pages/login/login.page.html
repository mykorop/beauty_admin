<main class="login-page bookme-dark">
  <section class="login-card">
    <div class="login-brand-row">
      <div>
        <div class="bookme-brand">BookMe<span aria-hidden="true">.</span></div>
        <p class="bookme-caption">BookMe Admin</p>
      </div>
      <app-language-switcher />
    </div>

    @if (errorMessage(); as message) {
      <p-message data-testid="login-error" severity="error" styleClass="mb-4 w-full">{{
        message
      }}</p-message>
    }
    @if (infoMessage(); as message) {
      <p-message data-testid="login-info" severity="info" styleClass="mb-4 w-full">{{
        message
      }}</p-message>
    }

    @if (step() === 'password') {
      <h1 class="mb-4 text-xl font-semibold text-ink">{{ 'login.title' | t }}</h1>
      <form class="flex flex-col gap-4" [formGroup]="passwordForm" (ngSubmit)="submitPassword()">
        <label class="flex flex-col gap-1 text-sm text-ink">
          {{ 'login.email' | t }}
          <input
            pInputText
            type="email"
            [invalid]="passwordForm.controls.email.touched && passwordForm.controls.email.invalid"
            [attr.aria-invalid]="
              passwordForm.controls.email.touched && passwordForm.controls.email.invalid
            "
            formControlName="email"
            autocomplete="username"
            data-testid="login-email"
          />
        </label>
        <label class="flex flex-col gap-1 text-sm text-ink">
          {{ 'login.password' | t }}
          <p-password
            formControlName="password"
            [feedback]="false"
            [toggleMask]="true"
            autocomplete="current-password"
            inputStyleClass="w-full"
            styleClass="w-full"
            data-testid="login-password"
          />
        </label>
        <p-button
          type="submit"
          styleClass="w-full"
          [label]="'login.submit' | t"
          [loading]="busy()"
          [disabled]="passwordForm.invalid || busy()"
          data-testid="login-submit"
        />
      </form>
    } @else {
      <h1 class="mb-2 text-xl font-semibold text-ink">{{ 'login.totp.title' | t }}</h1>
      <p class="mb-4 text-sm text-muted">{{ 'login.totp.hint' | t }}</p>
      <form class="flex flex-col gap-4" [formGroup]="totpForm" (ngSubmit)="submitTotp()">
        <p-inputotp
          role="group"
          formControlName="code"
          [length]="totpLength"
          [invalid]="!!errorMessage()"
          [integerOnly]="true"
          [autofocus]="true"
          [attr.aria-label]="'login.totp.code' | t"
          [pt]="{
            pcInputText: {
              root: {
                'aria-label': ('login.totp.code' | t),
                'aria-invalid': !!errorMessage(),
                autocomplete: 'one-time-code',
              },
            },
          }"
          data-testid="login-totp"
        />
        <p-button
          type="submit"
          styleClass="w-full"
          [label]="'login.totp.submit' | t"
          [loading]="busy()"
          [disabled]="totpForm.invalid || busy()"
          data-testid="login-totp-submit"
        />
        <p-button
          type="button"
          styleClass="w-full"
          severity="secondary"
          [text]="true"
          [label]="'login.totp.back' | t"
          [disabled]="busy()"
          (onClick)="backToPassword()"
        />
      </form>
    }
  </section>
</main>
