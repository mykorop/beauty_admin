<div class="admin-shell">
  <aside class="shell-sidebar bookme-dark">
    <div class="shell-brand-row">
      <div>
        <div class="bookme-brand">BookMe<span aria-hidden="true">.</span></div>
        <p class="bookme-caption">BookMe Admin</p>
      </div>
      <button
        #menuToggle
        class="navigation-toggle"
        type="button"
        [attr.aria-label]="'nav.menu' | t"
        aria-controls="main-navigation"
        [attr.aria-expanded]="navigationOpen()"
        (click)="navigationOpen.set(!navigationOpen())"
      >
        <i [class]="navigationOpen() ? 'pi pi-times' : 'pi pi-bars'" aria-hidden="true"></i>
      </button>
    </div>
    <nav
      id="main-navigation"
      class="shell-nav"
      [class.is-open]="navigationOpen()"
      data-testid="sidebar"
      [attr.aria-label]="'nav.menu' | t"
    >
      @for (section of sections; track section.path) {
        <a
          [routerLink]="['/', section.path]"
          routerLinkActive="is-current"
          ariaCurrentWhenActive="page"
          (click)="closeNavigation()"
        >
          <i [class]="section.icon" aria-hidden="true"></i>
          {{ section.labelKey | t }}
        </a>
      }
    </nav>
  </aside>

  <header class="shell-header bookme-dark">
    <span
      data-testid="environment-indicator"
      class="environment-badge"
      [class.environment-production]="stage === 'prod'"
    >
      {{ stageLabelKey | t }}
    </span>
    <div class="shell-account">
      <app-language-switcher />
      @if (admin(); as admin) {
        <span class="shell-email" data-testid="admin-email">{{ admin.email }}</span>
      }
      <p-button
        data-testid="sign-out"
        severity="secondary"
        size="small"
        icon="pi pi-sign-out"
        [label]="'header.signOut' | t"
        [loading]="signingOut()"
        (onClick)="signOut()"
      />
    </div>
  </header>

  <main class="shell-workspace" tabindex="-1">
    <router-outlet />
  </main>
</div>
